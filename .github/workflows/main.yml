
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Configure Secure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace("${{ secrets.RDP_PASSWORD }}")) {
            throw "RDP_PASSWORD secret is missing."
          }

          $password = ConvertTo-SecureString `
            "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force

          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name "RDP" `
              -Password $password `
              -PasswordNeverExpires `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name "RDP" -Password $password
            Enable-LocalUser -Name "RDP"
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "RDP" -ErrorAction SilentlyContinue

          # Enable RDP with NLA
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 2

          # Disable broad default RDP firewall rules
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          Start-Service TermService

          Write-Host "RDP configuration completed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.5-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          Remove-Item $installer -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          Write-Host "Tailscale installed successfully."

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Start-Service Tailscale

          & $ts up `
            "--authkey=$env:TS_AUTH_KEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {
            $ip = (& $ts ip -4 | Select-Object -First 1)

            if ($ip -match '^100\.') {
              break
            }

            Start-Sleep -Seconds 5
          }

          if ($ip -notmatch '^100\.') {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected."

      - name: Configure Tailscale-only Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Write-Host "Firewall configured."

      - name: Verify RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {
            throw "Remote Desktop service is not running."
          }

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (!$result.TcpTestSucceeded) {
            throw "RDP port 3389 connectivity test failed."
          }

          Write-Host "RDP connectivity test passed."
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"

      - name: Temporary Session
        shell: pwsh
        run: |
          Write-Host "RDP session is ready."
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Use your RDP_PASSWORD secret."
          Write-Host "Session will end automatically."

          $end = (Get-Date).AddMinutes(45)

          while ((Get-Date) -lt $end) {
            Write-Host "RDP session active: $(Get-Date)"
            Start-Sleep -Seconds 60
          }

          Write-Host "Session time completed."
